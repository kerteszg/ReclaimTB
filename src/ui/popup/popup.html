<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Schedule</title>
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body>
    <div class="panel">
      <h1>Schedule from email</h1>
      <div id="context" class="muted">Loading message…</div>
      <div id="status" class="status" hidden></div>
      <button type="button" class="menu-btn" id="btn-event">
        <div>
          <div class="title">New event</div>
          <div class="desc">Add to Google Calendar</div>
        </div>
      </button>
      <button type="button" class="menu-btn" id="btn-task">
        <div>
          <div class="title">New task</div>
          <div class="desc">Add to Reclaim</div>
        </div>
      </button>
      <div class="row" style="margin-top: 8px">
        <button type="button" id="btn-settings">Settings</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
